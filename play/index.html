<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도깨비 보스전 · WebGL</title>
<style>
  html, body { margin: 0; height: 100%; background: #06070a; overflow: hidden;
    font-family: 'Galmuri11', 'Malgun Gothic', monospace; color: #b4a893; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; background: #06070a; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  #bar { width: min(320px, 70vw); height: 12px; border: 2px solid #2a3843; background: #0b0e12; }
  #fill { height: 100%; width: 0; background: #d4623f; transition: width 120ms steps(4, end); }
  #pct { font-size: 12px; color: #8b8375; }
  #msg { font-size: 12px; line-height: 1.9; color: #8b8375; max-width: 34em; }
  .warn { color: #d4623f; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="-1"></canvas></div>
<div id="load">
  <div style="font-size:13px;color:#f4eee1">도깨비 보스전 · 알파 빌드</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="pct">0%</div>
  <div id="msg">약 42MB 를 받습니다. 처음 한 번만 받고 다음부터는 브라우저가 갖고 있습니다.<br>
    W A S D 이동 · 좌클릭 사격 · 우클릭 강공격 · Space 회피 · F2 페이즈 이동 · F3 배속</div>
</div>
<script>
var canvas = document.querySelector("#c");
var load = document.querySelector("#load");
var fill = document.querySelector("#fill");
var pct = document.querySelector("#pct");
var msg = document.querySelector("#msg");

// loader.js 를 먼저 받아야 createUnityInstance 가 생긴다
var s = document.createElement("script");
s.src = "Build/WebGL.loader.js";
s.onerror = function () { msg.innerHTML = '<span class="warn">로더를 받지 못했습니다.</span>'; };
s.onload = boot;
document.body.appendChild(s);

function boot() {
createUnityInstance(canvas, {
  dataUrl: "Build/WebGL.data.unityweb",
  frameworkUrl: "Build/WebGL.framework.js.unityweb",
  codeUrl: "Build/WebGL.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "donhwi",
  productName: "도깨비 보스전",
  productVersion: "0.1.0",
  autoSyncPersistentDataPath: true,
  showBanner: function () {}
}, function (p) {
  var v = Math.round(p * 100);
  fill.style.width = v + "%";
  pct.textContent = v + "%";
}).then(function () {
  load.remove();
  canvas.focus();
}).catch(function (e) {
  pct.textContent = "";
  msg.innerHTML = '<span class="warn">불러오지 못했습니다.</span><br>' +
    String(e).slice(0, 300);
});
}
</script>
</body>
</html>
